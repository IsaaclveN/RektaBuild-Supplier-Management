services:
    app:
      image: ${OPENBOXES_IMAGE:-rektabuild/supplier-openboxes:local}
      build:
        context: ../build/docker
      container_name: openboxes-app
      expose:
        - "8080"
      ports:
        - 8080:8080
      environment:
        DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
        DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
        DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false}
        GRAILS_SERVER_URL: ${GRAILS_SERVER_URL:-http://localhost:8080/openboxes/}
        JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms1024m -Xmx1024m -XX:+UseParallelGC -Djava.awt.headless=true}
        INVENTORY_TO_SUPPLY_TOKEN: ${INVENTORY_TO_SUPPLY_TOKEN:?Set INVENTORY_TO_SUPPLY_TOKEN in the Compose env file}
      healthcheck:
        test:
          - CMD-SHELL
          - >-
            curl --fail --silent --show-error --max-time 8
            http://127.0.0.1:8080/openboxes/health
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
        interval: 10s
        timeout: 10s
        retries: 12
        start_period: 120s

    nginx:
      image: nginx:1.13
      container_name: openboxes-nginx
      restart: always
      ports:
      - 80:80
      volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
