log_format upstream_timing '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           'status=$status upstream_addr=$upstream_addr upstream_status=$upstream_status '
                           'request_time=$request_time upstream_response_time=$upstream_response_time';

server {
    listen 80;
    server_name supplier.petcareplus.tech;

    access_log /var/log/nginx/reverse-access.log upstream_timing;
    error_log /var/log/nginx/reverse-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name supplier.petcareplus.tech;

    access_log /var/log/nginx/reverse-access.log upstream_timing;
    error_log /var/log/nginx/reverse-error.log;

    ssl_certificate /etc/letsencrypt/live/supplier.petcareplus.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supplier.petcareplus.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Resolve "app" through Docker's embedded DNS at request time so a
        # recreated app container (new IP) cannot leave a stale upstream -> 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $openboxes_upstream http://app:8080;
        proxy_pass $openboxes_upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
